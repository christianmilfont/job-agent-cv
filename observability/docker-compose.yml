# Stack local de observabilidade: backend --OTLP--> Collector --> Jaeger (traces)
#                                                              \-> spanmetrics -> Prometheus -> Grafana (dashboard)
# Subir:   docker compose -f observability/docker-compose.yml up -d
# Derrubar: docker compose -f observability/docker-compose.yml down   (use -v para apagar os dados)
name: jobagent-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP (usado pelo backend)
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    user: "0:0"   # necessário para gravar no volume do Badger (uso local)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger          # persiste os traces entre reinícios
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # uso local: abre sem login (somente leitura)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jobagent.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]

volumes:
  jaeger-data:
  prometheus-data:
  grafana-data:
